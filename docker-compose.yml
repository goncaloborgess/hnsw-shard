services:
  shard-0:
    build:
      context: .
      target: shard
    command: ["50051"]

  shard-1:
    build:
      context: .
      target: shard
    command: ["50051"]

  coordinator:
    build:
      context: .
      target: coordinator
    command: ["50050", "shard-0:50051", "shard-1:50051"]
    ports:
      - "50050:50050"
    depends_on:
      - shard-0
      - shard-1
